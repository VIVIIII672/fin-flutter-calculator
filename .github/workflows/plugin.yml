name: Build OpenRocket plugin
on:
  workflow_dispatch:
  push:
    paths: ['openrocket-plugin/**', '.github/workflows/plugin.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build jar
        working-directory: openrocket-plugin
        run: mvn -B package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fin-flutter-openrocket-jar
          path: openrocket-plugin/target/*.jar
